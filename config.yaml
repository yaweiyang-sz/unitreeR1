# =====================================================
#  Unitree R1 EDU 控制系统全局配置
# =====================================================

robot:
  # 网络接口名 — 必须是接 R1 机器人 LAN (192.168.123.x) 的那块网卡, 不是连外网/办公网的那块
  # 在 Jetson 上跑 `ip a` 看, 找 inet 是 192.168.123.164 的那块, 名字可能是:
  #   - eth10   (常见, Jetson 内部 eth0 是 dev 网, eth10 才是 R1 网)
  #   - eth0    (如果 Jetson 只有一块网线接 R1, 名字就是 eth0)
  #   - enp0s3, eno1  (某些 PCIe 网卡)
  # ChannelFactoryInitialize(0, interface) 会把这个网卡作为 DDS 出口
  network_interface: "eth10"
  # 机器人机载 PC2 (Jetson Nano) IP，调试用
  onboard_pc_ip: "192.168.123.164"
  # SportModeState_ DDS 订阅主题 (rt/sportmodestate 与 Go2 一致;
  # 新版固件用 rt/lf/sportmodestate, sdk_client 会自动 fallback)
  sport_state_topic: "rt/sportmodestate"
  # 是否启用 SportModeState_ 订阅 (拿到 IMU / 位置 / 速度 / yaw_speed 等富信息)。
  # 默认 false: 订阅跟 LocoClient RPC 抢 cyclonedds 资源, 某些 R1 固件上会引发
  # shutdown 段错误。打开前确认 R1 端稳定。
  enable_state_subscription: false
  # 是否在启动后让机器人真的进入 locomotion (FSM 811)。
  # 强烈建议保持 false, 用 CLI --enable-loco 显式触发。
  auto_enter_locomotion: false

# 手势识别
gesture:
  enabled: true
  # 连续 N 帧识别到同一手势才生效（防抖）
  debounce_frames: 6
  # 每帧最大处理时间 (ms)，超时则跳过
  max_inference_ms: 80
  # 中央识别区域 (相对画面 0~1), 只识别这个矩形内的手
  # 默认中央 40% 宽 x 70% 高, 边缘忽略 — 避免边上路过 / 背景人误触
  roi:
    x_pct: 0.30          # 左 30% 开始
    y_pct: 0.15          # 上 15% 开始
    w_pct: 0.40          # 宽 40% (留 30% 边缘)
    h_pct: 0.70          # 高 70% (留 15% 上下)
  # 手部大小过滤 (占画面面积的百分比), 防止太远/太近误识别
  # 拳头比张开手小很多, min 放宽到 1.5% 让拳头在正常距离就能识别
  min_hand_area_pct: 1.5    # < 1.5% 太远, 不识别
  max_hand_area_pct: 50.0   # > 50% 太近, 不识别

# 人体跟随
follow:
  enabled: false
  # 目标水平偏移 (px)，保持在画面中心
  target_center_x: 320        # 640 宽画面的中心
  # 目标面积 (像素²)，对应保持距离
  target_bbox_area: 50000
  # 距离/方向 P 控制增益
  kp_yaw: 0.0025              # 横向偏差 -> 角速度
  kp_distance: 0.00004        # 面积偏差 -> 线速度
  # 安全边界
  max_linear_speed: 0.3       # m/s
  max_angular_speed: 0.5      # rad/s
  deadzone_yaw: 30            # 中心 ±30px 不动
  deadzone_area: 8000         # 面积 ±8000px² 不动

# 视野显示
viewer:
  # 是否显示本地 OpenCV 窗口（Jetson Nano 上若没有显示器可关）
  opencv_window: true
  # 是否启动 Web 预览（局域网内浏览器看机器人的视野）
  web_stream: true
  web_port: 8080
  # 在画面上叠加的 UI
  show_gesture_label: true
  show_follow_target: true
  show_telemetry: true

# 主控
control:
  loop_hz: 30                 # 主循环频率
  # 自动从手势切到跟随的触发（张开手掌持续 1 秒）
  gesture_to_follow_hold_sec: 1.0
  # 急停命令 (z=stop)，按键盘 'q' 或机器人按钮
  emergency_stop_key: "q"
  # 转向方向符号: +1 默认 (你站机器人后方), -1 翻转 (你面对机器人)
  turn_direction_sign: 1
  # 默认速度 (m/s, rad/s)
  forward_speed: 0.3
  backward_speed: -0.2
  turn_speed: 0.5
